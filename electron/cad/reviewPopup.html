<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No scripts: the preload renders text only, through textContent. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'">
<title>Review CAD edit</title>
<style>
  :root {
    --background: #ffffff; --foreground: #0a0a0a; --muted: #f2f2f1; --muted-foreground: #666666;
    --border: #d4d4d4; --accent: #316081; --accent-foreground: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #141414; --foreground: #f5f5f4; --muted: #1c1c1a; --muted-foreground: #b5b5b5;
      --border: rgb(245 245 244 / 26%); --accent: #75aed7; --accent-foreground: #0d1b26;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--background); color: var(--foreground); }
  body {
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; border: 2px solid var(--accent);
    user-select: none; overflow: hidden;
  }
  header {
    -webkit-app-region: drag; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--accent); color: var(--accent-foreground); font-weight: 600;
  }
  header .project { font-weight: 400; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .timer { margin-left: auto; font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
  main { padding: 12px; }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  pre {
    margin: 0; max-height: 300px; overflow-y: auto; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--muted); font: inherit; white-space: pre-wrap; overflow-wrap: anywhere;
    user-select: text;
  }
  footer { display: flex; align-items: center; gap: 8px; padding: 0 12px 12px; }
  footer .note { color: var(--muted-foreground); font-size: 12px; margin-right: auto; }
  button {
    font: inherit; font-weight: 600; padding: 7px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--background); color: var(--foreground);
  }
  button.apply { background: var(--accent); border-color: var(--accent); color: var(--accent-foreground); }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: default; }
  @media (prefers-reduced-motion: no-preference) { button { transition: filter 120ms; } }
</style>
</head>
<body>
  <header><span id="application">Review CAD edit</span><span class="project" id="project"></span><span class="timer" id="timer"></span></header>
  <main>
    <h1 id="title"></h1>
    <pre id="summary"></pre>
  </main>
  <footer>
    <span class="note" id="note">Nothing is saved.</span>
    <button type="button" id="decline" tabindex="-1">Decline</button>
    <button type="button" id="apply" class="apply" tabindex="-1">Apply edit</button>
  </footer>
</body>
</html>
